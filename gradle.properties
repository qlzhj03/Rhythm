# 项目级 Gradle 设置。
# IDE（例如 Android Studio）用户请注意：
# 通过 IDE 配置的 Gradle 设置会 *覆盖* 本文件中的任何设置。
# 有关如何配置构建环境的更多详细信息，请访问
# http://www.gradle.org/docs/current/userguide/build_environment.html
# 指定用于守护进程的 JVM 参数。
# 此 16 GB 机器的内存预算：Gradle 守护进程 <= 约 3.5 GB RSS，Kotlin 守护进程 <= 约 1.5 GB RSS，
# 为 IDE 和操作系统留出空间。旧的 -Xmx4096m + ParallelGC 组合会提交整个 4 GB 堆且从不释放
#（实测：两个守护进程空闲时 RSS 分别为 5.9 GB + 1.4 GB）。
# 小 -Xms + G1 + MaxHeapFreeRatio：堆按需增长，并在构建后取消提交内存。
# -XX:MaxMetaspaceSize / ReservedCodeCacheSize 限制两个最大的堆外 JVM 区域。
# -XX:MaxGCPauseMillis=200 要求 G1 尽量将 GC 停顿控制在 200 ms 左右，但不会强制把堆扩大到 -Xmx。
org.gradle.jvmargs=-Xms512m -Xmx3072m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=320m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -XX:+UseStringDeduplication -Dfile.encoding=UTF-8
# 给 Kotlin 编译守护进程一个自己的（更小的）堆，而不是让它继承上面的堆设置。
kotlin.daemon.jvmargs=-Xms256m -Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30
# 空闲的 Gradle 守护进程否则会驻留 3 小时并占用其全部内存。
# Kotlin 守护进程是其客户端，会随之一同关闭，因此一个超时即可释放两者。
org.gradle.daemon.idletimeout=900000
# Gradle 没有“CPU %”旋钮：workers.max 是并发工作器租约的数量。
# 8 核 -> 4 个工作器，为 IDE 和操作系统留出余量。每个 KSP / AAPT2 / D8
# 工作器都是一个独立进程，因此这也限制了构建期间的峰值内存。
org.gradle.workers.max=4
# :app 和 :macrobenchmark 并行编译意味着内存中有两套 AGP/Kotlin 状态。
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
# 并行配置缓存的存储/加载（孵化中）。建议先在本地试用；
# 如果你的多模块配置阶段出现并发相关问题，删除这一行即可回退。
org.gradle.configuration-cache.parallel=true
# AndroidX 包结构，以更清楚地区分哪些包捆绑在
# Android 操作系统中，哪些打包在你的应用 APK 中
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# 本项目的 Kotlin 代码风格："official" 或 "obsolete"：
kotlin.code.style=official
android.uniquePackageNames=false
# Resource center lives in :core:designsystem; transitive R keeps chromahub.rhythm.app.R
# resolving for moved strings/drawables without touching 1000+ call sites (multi-module split).
android.nonTransitiveRClass=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

# 为 Gradle 9.4+ 启用并行同步
org.gradle.tooling.parallel=true